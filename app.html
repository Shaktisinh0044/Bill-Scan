<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillScan — App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap');
  :root {
    --ink: #1a2b4a; --ink-soft: #3d5278; --paper: #faf7f0; --paper-line: #e8e0d0;
    --accent: #2563eb; --accent-warm: #f59e0b; --white: #ffffff; --gray: #6b7280; --green: #15803d; --red: #b91c1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.5; }
  nav { background: var(--white); border-bottom: 1px solid var(--paper-line); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 920px; margin: 0 auto; }
  .logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .logo-mark { width: 24px; height: 24px; background: var(--ink); border-radius: 6px; position: relative; }
  .logo-mark::after { content: ''; position: absolute; inset: 5px 5px auto 5px; height: 2px; background: var(--accent-warm); box-shadow: 0 4px 0 var(--white), 0 7px 0 var(--accent-warm); }
  .nav-link { color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 500; }
  .main { max-width: 920px; margin: 28px auto; padding: 0 24px; }
  .page-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { color: var(--ink-soft); margin-bottom: 24px; }
  .card { background: var(--white); border: 1px solid var(--paper-line); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  .card-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin-bottom: 16px; }
  .card-num { width: 22px; height: 22px; background: var(--ink); color: var(--white); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .row label { font-size: 14px; color: var(--ink-soft); min-width: 70px; }
  select, input[type=number], input[type=text] { border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: var(--white); font-family: inherit; color: var(--ink); }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .upload-zone { border: 2px dashed var(--paper-line); border-radius: 12px; padding: 28px; text-align: center; cursor: pointer; background: var(--paper); transition: all 0.15s; }
  .upload-zone:hover { border-color: var(--accent); background: #f5f8ff; }
  .upload-zone input { display: none; }
  .uz-icon { font-size: 28px; margin-bottom: 8px; }
  .uz-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .uz-sub { font-size: 13px; color: var(--gray); }
  .page-chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #f0f9f2; border: 1px solid #bbe3c5; border-radius: 9px; font-size: 13px; margin-bottom: 8px; }
  .page-chip .pc-x { margin-left: auto; cursor: pointer; color: var(--red); font-weight: 700; font-size: 16px; }
  .btn { display: block; width: 100%; padding: 15px; font-size: 16px; font-weight: 700; background: var(--ink); color: var(--paper); border: none; border-radius: 11px; cursor: pointer; box-shadow: 0 4px 14px rgba(26,43,74,0.18); transition: transform 0.15s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { background: #c5cad4; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: var(--white); color: var(--ink); border: 1px solid var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 9px; cursor: pointer; font-size: 14px; }
  .btn-ghost:hover { background: var(--paper); }
  .status { text-align: center; padding: 28px; font-size: 15px; color: var(--ink-soft); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--paper-line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 12px; }
  th { background: var(--paper); padding: 9px 10px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); border-bottom: 1px solid var(--paper-line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--paper-line); }
  td input { width: 100%; border: none; background: transparent; font-size: 14px; font-family: inherit; color: var(--ink); }
  td input:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  .totals { width: 300px; margin-left: auto; }
  .totals .tr { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: var(--ink-soft); }
  .totals .tr.disc { color: var(--green); }
  .totals .tr.grand { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--ink); border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
  .meta-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .meta-grid .mg { flex: 1; min-width: 130px; }
  .meta-grid label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 4px; }
  .meta-grid input { width: 100%; }
  .error { color: var(--red); background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 16px; text-align: center; font-size: 14px; }
  .del { color: var(--red); cursor: pointer; font-weight: 700; text-align: center; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #print-area { display: none; }
  @media print { body > *:not(#print-area) { display: none !important; } #print-area { display: block !important; padding: 24px; } }
  @media (max-width: 600px) { .totals { width: 100%; } }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark"></span> BillScan</a>
    <a href="index.html" class="nav-link">← Home</a>
  </div>
</nav>

<div class="main">
  <div class="page-title">Make a bill</div>
  <div class="page-sub">Upload your bill photo and BillScan does the rest.</div>

  <div class="card">
    <div class="card-label"><span class="card-num">1</span> Choose format</div>
    <div class="row">
      <label>Format</label>
      <select id="fmt-choice" onchange="onFmtChange()">
        <option value="default1">Simple Estimate</option>
        <option value="default2">Tax Invoice (GST)</option>
        <option value="default3">Basic Cash Bill</option>
        <option value="upload">Upload my own format</option>
      </select>
    </div>
    <div id="fmt-upload-wrap" style="display:none;margin-top:10px">
      <div class="upload-zone" onclick="document.getElementById('inp-fmt').click()" id="box-fmt">
        <input type="file" id="inp-fmt" accept=".pdf,image/*" onchange="handleFmt(this)">
        <div class="uz-title" id="fmt-name">📄 Upload format PDF</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><span class="card-num">2</span> Bill photo(s)</div>
    <div id="pages-list"></div>
    <div class="upload-zone" onclick="document.getElementById('inp-page').click()">
      <input type="file" id="inp-page" accept="image/*,.pdf" onchange="addPage(this)">
      <div class="uz-icon">📷</div>
      <div class="uz-title">Add photo or page</div>
      <div class="uz-sub">JPG, PNG, iPhone or scanned PDF — add 1, 2 or 3 pages</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><span class="card-num">3</span> Options</div>
    <div class="row">
      <label>GST</label>
      <select id="gst-choice" onchange="toggleGst()">
        <option value="no">No GST</option>
        <option value="yes">Add GST</option>
      </select>
      <div id="gst-pct-wrap" style="display:none;align-items:center;gap:6px">
        <input type="number" id="gst-pct" value="18" min="0" max="28" style="width:70px"> <span>%</span>
      </div>
    </div>
    <div class="row">
      <label>Discount</label>
      <select id="disc-type" onchange="toggleDisc()">
        <option value="none">None</option>
        <option value="total_pct">Total %</option>
        <option value="total_flat">Total ₹</option>
        <option value="item_pct">Per item %</option>
      </select>
      <div id="disc-val-wrap" style="display:none;align-items:center;gap:6px">
        <input type="number" id="disc-val" value="0" min="0" style="width:80px" onchange="if(billData)refreshTotals()">
        <span id="disc-unit">%</span>
      </div>
    </div>
  </div>

  <button class="btn" id="btn-scan" onclick="runScan()" disabled>Scan &amp; Generate Bill</button>

  <div id="output" style="margin-top:16px"></div>
</div>

<div id="print-area"></div>

<script>
let fmtFile = null, pages = [], billData = null, invoiceCounter = 1;
window.onload = () => { const s = localStorage.getItem('invoice_counter'); if (s) invoiceCounter = parseInt(s); };

function onFmtChange() {
  document.getElementById('fmt-upload-wrap').style.display = document.getElementById('fmt-choice').value === 'upload' ? 'block' : 'none';
}
function handleFmt(inp) {
  fmtFile = inp.files[0]; if (!fmtFile) return;
  document.getElementById('fmt-name').textContent = '✓ ' + fmtFile.name;
}
function toBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
async function addPage(inp) {
  const file = inp.files[0]; if (!file) return;
  const b64 = await toBase64(file);
  pages.push({ name: file.name, mime: file.type || 'image/jpeg', data: b64 });
  inp.value = ''; renderPages(); checkReady();
}
function renderPages() {
  document.getElementById('pages-list').innerHTML = pages.map((p,i) =>
    `<div class="page-chip">📄 Page ${i+1}: ${p.name}<span class="pc-x" onclick="removePage(${i})">✕</span></div>`).join('');
}
function removePage(i) { pages.splice(i,1); renderPages(); checkReady(); }
function checkReady() { document.getElementById('btn-scan').disabled = pages.length === 0; }
function toggleGst() { document.getElementById('gst-pct-wrap').style.display = document.getElementById('gst-choice').value === 'yes' ? 'flex' : 'none'; if (billData) refreshTotals(); }
function toggleDisc() {
  const v = document.getElementById('disc-type').value;
  document.getElementById('disc-val-wrap').style.display = v === 'none' ? 'none' : 'flex';
  document.getElementById('disc-unit').textContent = v === 'total_flat' ? '₹' : '%';
  if (billData) refreshTotals();
}
async function runScan() {
  const btn = document.getElementById('btn-scan'); btn.disabled = true;
  const out = document.getElementById('output');
  out.innerHTML = '<div class="card"><div class="status"><span class="spinner"></span> Reading your bill...</div></div>';
  try {
    const r = await fetch('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ images: pages.map(p=>({mime:p.mime,data:p.data})) }) });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    let parsed = JSON.parse(data.result);
    if (parsed.error === 'not_a_bill') {
      out.innerHTML = '<div class="card"><div class="error">This doesn\'t look like a bill. Please upload a clear photo of your handwritten bill.</div></div>';
      btn.disabled = false; return;
    }
    billData = parsed; refreshTotals();
  } catch(e) {
    out.innerHTML = `<div class="card"><div class="error">Couldn't read it: ${e.message}<br>Try again with a clearer photo.</div></div>`;
    btn.disabled = false;
  }
}
function calcTotals(items, gstOn, gstPct, discType, discVal) {
  let subtotal=0, itemDiscTotal=0;
  items.forEach(it => {
    const amt = parseFloat(it.amount)||0; subtotal += amt;
    if (discType==='item_pct') { it._disc = amt*discVal/100; it._net = amt-it._disc; itemDiscTotal += it._disc; }
    else it._net = amt;
  });
  let billDisc=0;
  if (discType==='total_pct') billDisc = subtotal*discVal/100;
  if (discType==='total_flat') billDisc = discVal;
  const taxable = subtotal-itemDiscTotal-billDisc;
  const gstAmt = gstOn ? taxable*gstPct/100 : 0;
  return { subtotal, itemDiscTotal, billDisc, taxable, gstAmt, grand: taxable+gstAmt };
}
function refreshTotals() {
  const gstOn = document.getElementById('gst-choice').value==='yes';
  const gstPct = gstOn ? parseFloat(document.getElementById('gst-pct').value)||18 : 0;
  const discType = document.getElementById('disc-type').value;
  const discVal = parseFloat(document.getElementById('disc-val').value)||0;
  renderBill(gstOn, gstPct, discType, discVal);
}
function renderBill(gstOn, gstPct, discType, discVal) {
  const d = billData, t = calcTotals(d.items, gstOn, gstPct, discType, discVal);
  const today = new Date().toLocaleDateString('en-IN');
  const invNo = d.invoice_no || ('INV-'+String(invoiceCounter).padStart(4,'0'));
  const discCol = discType==='item_pct' ? '<th>Disc%</th>' : '';
  const rows = d.items.map((it,i) => {
    const dc = discType==='item_pct' ? `<td><input type="number" value="${discVal}" style="width:50px" onchange="refreshTotals()"></td>` : '';
    const amt = discType==='item_pct' ? (it._net||0) : (parseFloat(it.amount)||0);
    return `<tr>
      <td>${i+1}</td>
      <td><input value="${it.product||''}" onchange="billData.items[${i}].product=this.value"></td>
      <td><input type="number" value="${it.qty||0}" style="width:55px" onchange="billData.items[${i}].qty=parseFloat(this.value)||0;billData.items[${i}].amount=billData.items[${i}].qty*(billData.items[${i}].rate||0);refreshTotals()"></td>
      <td><input type="number" value="${it.rate||0}" style="width:70px" onchange="billData.items[${i}].rate=parseFloat(this.value)||0;billData.items[${i}].amount=(billData.items[${i}].qty||0)*billData.items[${i}].rate;refreshTotals()"></td>
      ${dc}
      <td style="text-align:right;font-weight:700">₹${amt.toFixed(2)}</td>
      <td class="del" onclick="billData.items.splice(${i},1);refreshTotals()">✕</td>
    </tr>`;
  }).join('');
  const subRow = discType!=='none' ? `<div class="tr"><span>Subtotal</span><span>₹${t.subtotal.toFixed(2)}</span></div>` : '';
  const discRow = (t.billDisc>0||t.itemDiscTotal>0) ? `<div class="tr disc"><span>Discount</span><span>- ₹${(t.billDisc+t.itemDiscTotal).toFixed(2)}</span></div>` : '';
  const gstRow = gstOn ? `<div class="tr"><span>GST (${gstPct}%)</span><span>₹${t.gstAmt.toFixed(2)}</span></div>` : '';
  document.getElementById('output').innerHTML = `
    <div class="card">
      <div class="card-label" style="color:var(--green)">✓ Bill ready — edit anything</div>
      <div class="meta-grid">
        <div class="mg"><label>Party</label><input id="b-party" value="${d.party||''}"></div>
        <div class="mg"><label>Invoice No</label><input id="b-inv" value="${invNo}"></div>
        <div class="mg"><label>Date</label><input id="b-date" value="${d.date||today}"></div>
        <div class="mg"><label>Billing No</label><input id="b-bill" value="${d.billing_no||''}"></div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Rate</th>${discCol}<th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="btn-ghost" style="font-size:13px;margin-bottom:14px" onclick="billData.items.push({product:'New item',qty:1,rate:0,amount:0});refreshTotals()">+ Add item</button>
      <div class="totals">${subRow}${discRow}${gstRow}<div class="tr grand"><span>Grand Total</span><span>₹${t.grand.toFixed(2)}</span></div></div>
      <div class="actions">
        <button class="btn-ghost" onclick="saveAndPrint()">🖨️ Download / Print</button>
        <button class="btn-ghost" onclick="shareWhatsApp()">💬 WhatsApp</button>
        <button class="btn-ghost" onclick="location.reload()">↺ Start over</button>
      </div>
    </div>`;
  preparePrint(t, gstOn, gstPct, invNo);
  document.getElementById('btn-scan').disabled = false;
}
function preparePrint(t, gstOn, gstPct, invNo) {
  const d = billData;
  const party = document.getElementById('b-party')?.value||d.party||'';
  const date = document.getElementById('b-date')?.value||new Date().toLocaleDateString('en-IN');
  const bill = document.getElementById('b-bill')?.value||d.billing_no||'';
  const rows = d.items.map((it,i)=>`<tr><td style="border:1px solid #999;padding:7px">${i+1}</td><td style="border:1px solid #999;padding:7px">${it.product||''}</td><td style="border:1px solid #999;padding:7px;text-align:right">${it.qty||0}</td><td style="border:1px solid #999;padding:7px;text-align:right">₹${(parseFloat(it.rate)||0).toFixed(2)}</td><td style="border:1px solid #999;padding:7px;text-align:right">₹${(parseFloat(it.amount)||0).toFixed(2)}</td></tr>`).join('');
  const gstRow = gstOn?`<tr><td colspan="4" style="text-align:right;padding:5px">GST (${gstPct}%)</td><td style="text-align:right;padding:5px">₹${t.gstAmt.toFixed(2)}</td></tr>`:'';
  const discRow = (t.billDisc>0||t.itemDiscTotal>0)?`<tr><td colspan="4" style="text-align:right;padding:5px;color:green">Discount</td><td style="text-align:right;padding:5px;color:green">- ₹${(t.billDisc+t.itemDiscTotal).toFixed(2)}</td></tr>`:'';
  document.getElementById('print-area').innerHTML = `
    <div style="font-family:Arial;max-width:700px;margin:auto;color:#1a2b4a">
      <h1 style="text-align:center;font-family:Georgia,serif">ESTIMATE</h1>
      <p style="text-align:center;font-size:12px;color:#666;margin-bottom:18px">Tax Invoice / Debit Memo</p>
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:13px">
        <div><b>Party:</b> ${party}<br><b>Billing No:</b> ${bill}</div>
        <div style="text-align:right"><b>Invoice No:</b> ${invNo}<br><b>Date:</b> ${date}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px">
        <thead><tr style="background:#f0f0f0"><th style="border:1px solid #999;padding:7px">#</th><th style="border:1px solid #999;padding:7px;text-align:left">Product</th><th style="border:1px solid #999;padding:7px">Qty</th><th style="border:1px solid #999;padding:7px">Rate</th><th style="border:1px solid #999;padding:7px">Amount</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <table style="width:300px;margin-left:auto;font-size:13px">${discRow}${gstRow}<tr style="font-weight:700;font-size:16px;border-top:2px solid #000"><td colspan="4" style="text-align:right;padding:7px">Grand Total</td><td style="text-align:right;padding:7px">₹${t.grand.toFixed(2)}</td></tr></table>
      <p style="margin-top:34px;text-align:right;font-size:13px">For, ESTIMATE<br><br>(Authorised Signatory)</p>
    </div>`;
}
function saveAndPrint() { invoiceCounter++; localStorage.setItem('invoice_counter', invoiceCounter); window.print(); }
function shareWhatsApp() {
  const d = billData; const party = document.getElementById('b-party')?.value||'';
  let msg = `*BILL*\n`; if (party) msg += `Party: ${party}\n`; msg += `\n`;
  d.items.forEach((it,i)=>{ msg += `${i+1}. ${it.product} - ${it.qty} x ₹${it.rate} = ₹${(parseFloat(it.amount)||0).toFixed(2)}\n`; });
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}
</script>
</body>
</html>
