<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillScan — App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap');
  :root {
    --ink:#1a2b4a;--ink-soft:#3d5278;--paper:#faf7f0;--paper-line:#e8e0d0;
    --accent:#2563eb;--accent-warm:#f59e0b;--white:#ffffff;--gray:#6b7280;--green:#15803d;--red:#b91c1c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;}
  nav{background:var(--white);border-bottom:1px solid var(--paper-line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:960px;margin:0 auto;}
  .logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
  .logo-mark{width:24px;height:24px;background:var(--ink);border-radius:6px;position:relative;}
  .logo-mark::after{content:'';position:absolute;inset:5px 5px auto 5px;height:2px;background:var(--accent-warm);box-shadow:0 4px 0 var(--white),0 7px 0 var(--accent-warm);}
  .main{max-width:960px;margin:24px auto;padding:0 20px;}
  .page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin-bottom:4px;}
  .page-sub{color:var(--ink-soft);margin-bottom:20px;font-size:14px;}
  .card{background:var(--white);border:1px solid var(--paper-line);border-radius:14px;padding:20px;margin-bottom:14px;}
  .card-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin-bottom:14px;}
  .card-num{width:22px;height:22px;background:var(--ink);color:var(--white);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .row label{font-size:13px;color:var(--ink-soft);min-width:70px;}
  select,input[type=number],input[type=text]{border:1px solid var(--paper-line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--white);font-family:inherit;color:var(--ink);}
  select:focus,input:focus{outline:none;border-color:var(--accent);}
  .upload-zone{border:2px dashed var(--paper-line);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--paper);transition:all .15s;}
  .upload-zone:hover{border-color:var(--accent);background:#f5f8ff;}
  .upload-zone input{display:none;}
  .uz-icon{font-size:26px;margin-bottom:6px;}
  .uz-title{font-size:14px;font-weight:700;margin-bottom:3px;}
  .uz-sub{font-size:12px;color:var(--gray);}
  .page-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f0f9f2;border:1px solid #bbe3c5;border-radius:8px;font-size:12px;margin-bottom:6px;}
  .page-chip .pc-x{margin-left:auto;cursor:pointer;color:var(--red);font-weight:700;font-size:15px;}
  .btn{display:block;width:100%;padding:14px;font-size:15px;font-weight:700;background:var(--ink);color:var(--paper);border:none;border-radius:11px;cursor:pointer;box-shadow:0 4px 14px rgba(26,43,74,.18);transition:transform .15s;}
  .btn:hover:not(:disabled){transform:translateY(-2px);}
  .btn:disabled{background:#c5cad4;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--paper-line);font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;font-size:13px;}
  .btn-ghost:hover{background:var(--paper);border-color:var(--ink);}
  .status{text-align:center;padding:24px;font-size:14px;color:var(--ink-soft);}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--paper-line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg)}}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;}
  th{background:var(--paper);padding:8px 10px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);border-bottom:1px solid var(--paper-line);}
  td{padding:7px 10px;border-bottom:1px solid var(--paper-line);}
  td input{width:100%;border:none;background:transparent;font-size:13px;font-family:inherit;color:var(--ink);}
  td input:focus{outline:1px solid var(--accent);border-radius:3px;}
  .totals{width:300px;margin-left:auto;}
  .totals .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--ink-soft);}
  .totals .tr.disc{color:var(--green);}
  .totals .tr.grand{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--ink);border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;}
  .meta-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .meta-grid .mg{flex:1;min-width:130px;}
  .meta-grid label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;}
  .meta-grid input{width:100%;}
  .error{color:var(--red);background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px;text-align:center;font-size:14px;}
  .del{color:var(--red);cursor:pointer;font-weight:700;text-align:center;font-size:16px;}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .match-badge{font-size:10px;background:#eff6ff;color:var(--accent);padding:1px 6px;border-radius:10px;margin-left:4px;font-weight:600;}
  #print-area{display:none;}
  @media print{body>*:not(#print-area){display:none!important;}#print-area{display:block!important;padding:20px;font-family:Arial,sans-serif;}}
  @media(max-width:600px){.totals{width:100%;}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark"></span> BillScan</a>
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:500;">← Home</a>
  </div>
</nav>

<div class="main">
  <div class="page-title">Make a bill</div>
  <div class="page-sub">Upload your bill photo — BillScan reads it and fills it in automatically.</div>

  <!-- STEP 1 FORMAT -->
  <div class="card">
    <div class="card-label"><span class="card-num">1</span> Choose output format</div>
    <div class="row">
      <label>Format</label>
      <select id="fmt-choice">
        <option value="mama">Mama Format (M-143 Estimate)</option>
        <option value="default1">Simple Estimate</option>
        <option value="default2">Tax Invoice (GST)</option>
        <option value="default3">Basic Cash Bill</option>
      </select>
    </div>
  </div>

  <!-- STEP 2 PHOTOS -->
  <div class="card">
    <div class="card-label"><span class="card-num">2</span> Bill photo(s)</div>
    <div id="pages-list"></div>
    <div class="upload-zone" onclick="document.getElementById('inp-page').click()">
      <input type="file" id="inp-page" accept="image/*,.pdf" onchange="addPage(this)">
      <div class="uz-icon">📷</div>
      <div class="uz-title">Add photo or page</div>
      <div class="uz-sub">JPG, PNG, iPhone or scanned PDF — add 1, 2 or 3 pages</div>
    </div>
  </div>

  <!-- STEP 3 OPTIONS -->
  <div class="card">
    <div class="card-label"><span class="card-num">3</span> Options</div>
    <div class="row">
      <label>GST</label>
      <select id="gst-choice" onchange="toggleGst()">
        <option value="no">No GST</option>
        <option value="yes">Add GST</option>
      </select>
      <div id="gst-pct-wrap" style="display:none;align-items:center;gap:6px;">
        <input type="number" id="gst-pct" value="18" min="0" max="28" style="width:65px;"> <span>%</span>
      </div>
    </div>
    <div class="row">
      <label>Discount</label>
      <select id="disc-type" onchange="toggleDisc()">
        <option value="none">None</option>
        <option value="total_pct">Total %</option>
        <option value="total_flat">Total ₹</option>
        <option value="item_pct">Per item %</option>
      </select>
      <div id="disc-val-wrap" style="display:none;align-items:center;gap:6px;">
        <input type="number" id="disc-val" value="0" min="0" style="width:75px;" onchange="if(billData)refreshTotals()">
        <span id="disc-unit">%</span>
      </div>
    </div>
  </div>

  <button class="btn" id="btn-scan" onclick="runScan()" disabled>Scan &amp; Generate Bill</button>
  <div id="output" style="margin-top:16px;"></div>
</div>

<div id="print-area"></div>

let pages = [], billData = null, invoiceCounter = 1;
window.onload = () => { const s = localStorage.getItem('inv_count'); if(s) invoiceCounter = parseInt(s); };

// ── FUZZY MATCH ──
function normalize(s){ return s.toUpperCase().replace(/[^A-Z0-9]/g,''); }
function similarity(a, b){
  a = normalize(a); b = normalize(b);
  if(b.includes(a) || a.includes(b)) return 0.9;
  let matches = 0;
  for(let i=0;i<Math.min(a.length,b.length);i++){ if(a[i]===b[i]) matches++; }
  return matches / Math.max(a.length, b.length);
}
function findMatch(scannedName){
  let best = null, bestScore = 0;
  for(const p of PRODUCTS){
    const fullName = p.cat + ' ' + p.name;
    const s = Math.max(similarity(scannedName, fullName), similarity(scannedName, p.name));
    if(s > bestScore && s > 0.45){ bestScore = s; best = p; }
  }
  return best ? { product: best.cat + ' ' + best.name, price: best.price, score: bestScore } : null;
}

// ── UPLOADS ──
function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function addPage(inp){
  const file = inp.files[0]; if(!file) return;
  const b64 = await toBase64(file);
  pages.push({ name: file.name, mime: file.type||'image/jpeg', data: b64 });
  inp.value = ''; renderPages(); checkReady();
}
function renderPages(){
  document.getElementById('pages-list').innerHTML = pages.map((p,i)=>
    `<div class="page-chip">📄 Page ${i+1}: ${p.name}<span class="pc-x" onclick="removePage(${i})">✕</span></div>`).join('');
}
function removePage(i){ pages.splice(i,1); renderPages(); checkReady(); }
function checkReady(){ document.getElementById('btn-scan').disabled = pages.length===0; }
function toggleGst(){ document.getElementById('gst-pct-wrap').style.display = document.getElementById('gst-choice').value==='yes'?'flex':'none'; if(billData) refreshTotals(); }
function toggleDisc(){
  const v = document.getElementById('disc-type').value;
  document.getElementById('disc-val-wrap').style.display = v==='none'?'none':'flex';
  document.getElementById('disc-unit').textContent = v==='total_flat'?'₹':'%';
  if(billData) refreshTotals();
}

// ── SCAN ──
async function runScan(){
  const btn = document.getElementById('btn-scan'); btn.disabled = true;
  const out = document.getElementById('output');
  out.innerHTML = '<div class="card"><div class="status"><span class="spinner"></span> Reading your bill...</div></div>';
  try {
    const r = await fetch('/api/scan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ images: pages.map(p=>({mime:p.mime,data:p.data})) })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    let parsed = JSON.parse(data.result);
    if(parsed.error==='not_a_bill'){
      out.innerHTML = `<div class="card"><div class="error">This does not look like a bill. Please upload a clear photo of your handwritten bill.</div></div>`;
      btn.disabled = false; return;
    }

    // Apply fuzzy matching to each item
    parsed.items = parsed.items.map(it => {
      const match = findMatch(it.product);
      if(match && match.score > 0.55){
        return {
          ...it,
          product: match.product,
          rate: it.rate > 0 ? it.rate : match.price,
          amount: it.qty * (it.rate > 0 ? it.rate : match.price),
          _matched: true
        };
      }
      return it;
    });

    billData = parsed;
    refreshTotals();
  } catch(e) {
    out.innerHTML = `<div class="card"><div class="error">Could not read bill: ${e.message}<br>Try again with a clearer photo.</div></div>`;
    btn.disabled = false;
  }
}

// ── TOTALS ──
function calcTotals(items, gstOn, gstPct, discType, discVal){
  let subtotal=0, itemDiscTotal=0;
  items.forEach(it=>{
    const amt=parseFloat(it.amount)||0; subtotal+=amt;
    if(discType==='item_pct'){ it._disc=amt*discVal/100; it._net=amt-it._disc; itemDiscTotal+=it._disc; }
    else it._net=amt;
  });
  let billDisc=0;
  if(discType==='total_pct') billDisc=subtotal*discVal/100;
  if(discType==='total_flat') billDisc=discVal;
  const taxable=subtotal-itemDiscTotal-billDisc;
  const gstAmt=gstOn?taxable*gstPct/100:0;
  return {subtotal,itemDiscTotal,billDisc,taxable,gstAmt,grand:taxable+gstAmt};
}
function refreshTotals(){
  const gstOn=document.getElementById('gst-choice').value==='yes';
  const gstPct=gstOn?parseFloat(document.getElementById('gst-pct').value)||18:0;
  const discType=document.getElementById('disc-type').value;
  const discVal=parseFloat(document.getElementById('disc-val').value)||0;
  renderBill(gstOn,gstPct,discType,discVal);
}

  }).join('');

  const subRow=discType!=='none'?`<div class="tr"><span>Subtotal</span><span>₹${t.subtotal.toFixed(2)}</span></div>`:'';
  const discRow=(t.billDisc>0||t.itemDiscTotal>0)?`<div class="tr disc"><span>Discount</span><span>- ₹${(t.billDisc+t.itemDiscTotal).toFixed(2)}</span></div>`:'';
  const gstRow=gstOn?`<div class="tr"><span>GST (${gstPct}%)</span><span>₹${t.gstAmt.toFixed(2)}</span></div>`:'';

  document.getElementById('output').innerHTML=`
    <div class="card">
      <div class="card-label" style="color:var(--green)">✓ Bill ready — edit anything below</div>
      <div class="meta-grid">
        <div class="mg"><label>Party / Customer</label><input id="b-party" value="${d.party||''}"></div>

      </div>
      <table>
        <thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Rate</th>${discCol}<th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="btn-ghost" style="font-size:12px;margin-bottom:12px;" onclick="billData.items.push({product:'New Item',qty:1,rate:0,amount:0,_matched:false});refreshTotals()">+ Add item</button>
      <div class="totals">${subRow}${discRow}${gstRow}<div class="tr grand"><span>Grand Total</span><span>₹${t.grand.toFixed(2)}</span></div></div>
      <div class="actions">
        <button class="btn-ghost" onclick="generatePrint()">🖨️ Download / Print</button>
        <button class="btn-ghost" onclick="shareWhatsApp()">💬 WhatsApp</button>
        <button class="btn-ghost" onclick="location.reload()">↺ Start over</button>
      </div>
    </div>`;

  preparePrintData(t,gstOn,gstPct,invNo);
  document.getElementById('btn-scan').disabled=false;

function preparePrintData(t,gstOn,gstPct,invNo){
  window._printData = {
    t, gstOn, gstPct, invNo,
    party: document.getElementById('b-party')?.value||'',
    date: document.getElementById('b-date')?.value||new Date().toLocaleDateString('en-IN'),
    bill: document.getElementById('b-bill')?.value||'',
    items: billData.items,
    fmt: document.getElementById('fmt-choice').value
  };
}

function generatePrint(){
  invoiceCounter++; localStorage.setItem('inv_count', invoiceCounter);
  const p = window._printData;
  const fmt = document.getElementById('fmt-choice').value;
  if(fmt==='mama'){
    printMamaFormat(p);
  } else {
    printSimpleFormat(p);
  }
}

// ── SIMPLE FORMAT ──
function printSimpleFormat(p){
  const rows = p.items.map((it,i)=>`<tr>
    <td style="border:1px solid #ccc;padding:6px">${i+1}</td>
    <td style="border:1px solid #ccc;padding:6px">${it.product||''}</td>
    <td style="border:1px solid #ccc;padding:6px;text-align:right">${it.qty||0}</td>
    <td style="border:1px solid #ccc;padding:6px;text-align:right">₹${parseFloat(it.rate||0).toFixed(2)}</td>
    <td style="border:1px solid #ccc;padding:6px;text-align:right">₹${parseFloat(it.amount||0).toFixed(2)}</td>
  </tr>`).join('');
  const gstRow = p.gstOn?`<tr><td colspan="4" style="text-align:right;padding:5px">GST (${p.gstPct}%)</td><td style="text-align:right;padding:5px">₹${p.t.gstAmt.toFixed(2)}</td></tr>`:'';
  const discRow = (p.t.billDisc>0||p.t.itemDiscTotal>0)?`<tr><td colspan="4" style="text-align:right;padding:5px;color:green">Discount</td><td style="text-align:right;padding:5px;color:green">-₹${(p.t.billDisc+p.t.itemDiscTotal).toFixed(2)}</td></tr>`:'';

  document.getElementById('print-area').innerHTML = `
    <div style="font-family:Arial;max-width:700px;margin:auto;color:#1a2b4a">
      <h1 style="text-align:center;font-family:Georgia,serif;margin-bottom:4px">ESTIMATE</h1>
      <p style="text-align:center;font-size:12px;color:#666;margin-bottom:16px">Tax Invoice / Debit Memo</p>
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px">
        <div><b>Party:</b> ${p.party}<br><b>Billing No:</b> ${p.bill}</div>
        <div style="text-align:right"><b>Invoice No:</b> ${p.invNo}<br><b>Date:</b> ${p.date}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px">
        <thead><tr style="background:#f0f0f0">
          <th style="border:1px solid #ccc;padding:7px">#</th>
          <th style="border:1px solid #ccc;padding:7px;text-align:left">Product</th>
          <th style="border:1px solid #ccc;padding:7px">Qty</th>
          <th style="border:1px solid #ccc;padding:7px">Rate</th>
          <th style="border:1px solid #ccc;padding:7px">Amount</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <table style="width:280px;margin-left:auto;font-size:13px">${discRow}${gstRow}
        <tr style="font-weight:700;font-size:15px;border-top:2px solid #000">
          <td colspan="4" style="text-align:right;padding:7px">Grand Total</td>
          <td style="text-align:right;padding:7px">₹${p.t.grand.toFixed(2)}</td>
        </tr>
      </table>
      <p style="margin-top:30px;text-align:right;font-size:13px">For, ESTIMATE<br><br>(Authorised Signatory)</p>
    </div>`;
  window.print();
}

// ── NUMBER TO WORDS ──
function numberToWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n===0) return 'Zero';
  if(n<20) return a[n];
  if(n<100) return b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  if(n<1000) return a[Math.floor(n/100)]+' Hundred'+(n%100?' '+numberToWords(n%100):'');
  if(n<100000) return numberToWords(Math.floor(n/1000))+' Thousand'+(n%1000?' '+numberToWords(n%1000):'');
  if(n<10000000) return numberToWords(Math.floor(n/100000))+' Lakh'+(n%100000?' '+numberToWords(n%100000):'');
  return numberToWords(Math.floor(n/10000000))+' Crore'+(n%10000000?' '+numberToWords(n%10000000):'');
}

// ── WHATSAPP ──
function shareWhatsApp(){
  const d=billData; const party=document.getElementById('b-party')?.value||'';
  let msg=`*BILL*\n`; if(party) msg+=`Party: ${party}\n`; msg+=`\n`;
  d.items.forEach((it,i)=>{ msg+=`${i+1}. ${it.product} — ${it.qty} x ₹${it.rate} = ₹${parseFloat(it.amount||0).toFixed(2)}\n`; });
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
